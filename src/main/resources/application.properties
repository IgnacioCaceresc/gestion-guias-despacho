# Configuración del Servidor
server.port=8080

# Configuración de Base de Datos - Oracle Cloud Autónoma (Con Wallet)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=oracle.jdbc.OracleDriver

# Configuración del TNS Admin para que Docker encuentre la Wallet descomprimida
spring.datasource.oracle.connection-properties=oracle.net.tns_admin=/app/wallet

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Almacenamiento Dual (EFS + S3)
storage.efs.path=${EFS_PATH:/tmp/guias-despacho}
aws.s3.enabled=${S3_ENABLED:false}
aws.s3.bucket=${S3_BUCKET}
aws.s3.region=${AWS_REGION:us-east-1}