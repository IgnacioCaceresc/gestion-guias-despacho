server.port=8080

# Base de datos Autónoma en Oracle Cloud con Wallet interna
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=oracle.jdbc.OracleDriver
spring.datasource.oracle.connection-properties=oracle.net.tns_admin=/app/wallet

# Configuración Hibernate Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Almacenamiento Dual (EFS local y S3 remoto)
storage.efs.path=${EFS_PATH:/tmp/guias-despacho}
aws.s3.enabled=${S3_ENABLED:false}
aws.s3.bucket=${S3_BUCKET}
aws.s3.region=${AWS_REGION:us-east-1}

app.efs.path=${EFS_PATH:/tmp/guias-despacho}